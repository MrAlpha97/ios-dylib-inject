
name: Build WhatsApp Siri Patch

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Download source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure iOS build
        run: cmake -B build-cmake

      - name: Compile patches
        run: |
          cmake --build build-cmake \
            --target WhatsAppDisableSiriEntitlement NetworkLoader \
            --parallel 4

      - name: Upload compiled dylibs
        uses: actions/upload-artifact@v4
        with:
          name: WhatsApp-Siri-Fix
          if-no-files-found: error
          path: |
            build/WhatsAppDisableSiriEntitlement.dylib
            build/NetworkLoader.dylib
